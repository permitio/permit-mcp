# Configuration for the CI script tests (the test_*.py files here), passed with
# -c so pytest does not read the project's [tool.pytest], whose testpaths and
# asyncio_mode belong to the package's suite. The tests need only pytest and the
# standard library; test_ci_checks.py also runs bash, jq and yq (mikefarah v4),
# as GitHub's ubuntu-24.04 runners have them. Any warning is an error.
[pytest]
# strict_config, strict_markers, strict_xfail and strict_parametrization_ids.
strict = true
filterwarnings = error
