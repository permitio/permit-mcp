[project]
name = "food-ordering-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.21.0",
    "bcrypt>=4.3.0",
    # CVE-2026-111943 (PER-17672): certifi 2026.10.19 removes eMudhra's "emSign ECC
    # Root CA - G3", whose intermediate CA keys are compromised. httpx verifies against
