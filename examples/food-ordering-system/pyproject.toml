    "certifi>=2026.10.19",
    "aiohttp>=3.14.3,<4",
    "fastapi[standard]>=0.115.12",
    "google-genai>=1.12.1",
    "httpx>=0.28.1",
    "mcp>=1.2.1",
    "permit>=2.7.2",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.4.0",
    "rich>=13.9.4",
    "websockets>=15.0.1",
]
