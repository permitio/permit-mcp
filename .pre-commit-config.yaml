# Run by prek (see CONTRIBUTING.md). `language: system` hooks run a command from the
# environment prek was started in; ruff, mypy and typos come from uv.lock.
#
# An older prek stops with an error here rather than running the hooks differently.
minimum_prek_version: "0.5.3"

# The Python that `language: python` hook environments are built with: the floor in
# requires-python. Without it prek uses whichever Python uv finds first.
default_language_version:
  python: "3.11"

repos:
  # Pinned to commits rather than tags, which can be moved; each `# frozen:` comment
  # names the release, and Dependabot updates both.
  #
  # `language: python` runs the upstream release's hooks instead of prek's built-in
  # Rust versions, which accept some inputs the upstream hooks reject (unknown YAML
  # tags, TOML 1.1, an empty JSON file).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        language: python
      - id: end-of-file-fixer
        language: python
      - id: check-added-large-files
        language: python
      - id: check-case-conflict
        language: python
      - id: check-executables-have-shebangs
        language: python
      - id: check-shebang-scripts-are-executable
        language: python
      - id: check-json
        language: python
      - id: check-toml
        language: python
      - id: check-yaml
        language: python
      - id: check-merge-conflict
        language: python
      - id: mixed-line-ending
        language: python
        args: [--fix=lf]

  # From the project environment, so uv.lock holds the only versions of these tools
  # and mypy checks against the real dependencies. `uv run --locked` fails when
  # uv.lock is stale.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        # pyproject.toml too: ruff validates its [project] table (RUF200).
        files: (\.pyi?|(^|/)pyproject\.toml)$
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        # No file names: mypy checks the `files` set in pyproject.toml as a whole.
        entry: uv run --locked mypy
        language: system
        files: (\.pyi?|^pyproject\.toml|^uv\.lock)$
        pass_filenames: false
        require_serial: true
      - id: typos
        name: typos
        entry: uv run --locked typos --force-exclude
        language: system
        types: [text]
        require_serial: true
      # Fails when pyproject.toml and uv.lock disagree; run `uv lock` to fix.
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(uv\.lock|pyproject\.toml)$
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
