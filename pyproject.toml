[project]
name = "permit-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.21.0",
    "mcp>=1.2.1",
    "permit>=2.7.2",
    "httpx>=0.28.1",
    # CVE-2026-111943 (PER-17672): certifi 2026.10.19 removes eMudhra's "emSign ECC
    # Root CA - G3", whose intermediate CA keys are compromised. httpx verifies against
    # certifi unless SSL_CERT_FILE is set; server.py points the permit SDK's aiohttp at it.
    "certifi>=2026.10.19",
    "python-dotenv>=1.0.1",
]

[tool.uv.workspace]
members = ["examples/food-ordering-system"]
